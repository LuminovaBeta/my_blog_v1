{% extends 'library/base.html' %}
{% block css %}{{ block.super }}<link rel="stylesheet" href="/static/css/library/excerpts.css">{% endblock %}
{% block library_content %}
<section class="library-panel excerpt-intro">
    <div><span class="library-eyebrow">WORDS TO KEEP</span><h1>独立摘录</h1><p>收集电影、网页和日常遇到的句子；书里的好句记录在对应书籍里。</p></div>
    <a class="library-button library-button-primary" href="{% url 'library:add_excerpt' %}">添加摘录</a>
</section>
<section class="library-panel excerpt-collection">
    <div class="library-section-heading"><div><h2>独立摘录列表</h2><p>这些摘录仅自己可见。</p></div></div>
    <form class="excerpt-toolbar" method="get" role="search" aria-label="筛选独立摘录" data-library-filter-form>
        <label class="excerpt-search"><span class="visually-hidden">搜索句子、作品或作者</span><i class="fa fa-search" aria-hidden="true"></i><input type="search" name="q" value="{{ query }}" placeholder="搜索句子、作品或作者，按回车确认" autocomplete="off"></label>
        <label class="excerpt-select"><span class="visually-hidden">内容类别</span><select name="category" aria-label="内容类别" onchange="this.form.requestSubmit()"><option value="">全部类别</option>{% for value, label in categories %}<option value="{{ value }}"{% if category == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
        <label class="excerpt-select"><span class="visually-hidden">摘录来源</span><select name="source" aria-label="摘录来源" onchange="this.form.requestSubmit()"><option value="">全部来源</option>{% for value, label in sources %}<option value="{{ value }}"{% if source == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    </form>
    <p class="library-filter-error" data-library-filter-error role="alert" hidden>筛选失败，请重试。</p>
    <div data-library-results aria-live="polite">{% include 'library/excerpt_results.html' %}</div>
</section>
{% endblock %}
