{% extends 'library/base.html' %}
{% block library_content %}
<section class="library-panel library-intro">
    <div><span class="library-eyebrow">MY LIBRARY</span><h1>我的书库</h1><p>整理读过的书，也留一个地方给准备开始的阅读。</p></div>
    <a class="library-button library-button-primary" href="{% url 'library:add_book' %}">添加书籍</a>
</section>
<div class="library-stats" aria-label="书库数据概览">
    <div class="library-panel"><strong>{{ total_count }}</strong><span>全部书籍</span></div>
    <div class="library-panel"><strong>{{ reading_count }}</strong><span>正在阅读</span></div>
    <div class="library-panel"><strong>{{ finished_count }}</strong><span>已经读完</span></div>
</div>
<section class="library-panel library-collection">
    <div class="library-section-heading"><div><h2>我的书架</h2><p>只有你能看到自己的书籍和书中好句。</p></div></div>
    <form class="library-tools" method="get" role="search" data-library-filter-form>
        <input type="search" name="q" value="{{ query }}" placeholder="搜索书名或作者，按回车确认" aria-label="搜索书名或作者">
        <select name="status" aria-label="阅读状态" onchange="this.form.requestSubmit()">
            <option value="">全部状态</option>
            <option value="want"{% if status == 'want' %} selected{% endif %}>想读</option>
            <option value="reading"{% if status == 'reading' %} selected{% endif %}>在读</option>
            <option value="finished"{% if status == 'finished' %} selected{% endif %}>已读</option>
        </select>
    </form>
    <p class="library-filter-error" data-library-filter-error role="alert" hidden>筛选失败，请重试。</p>
    <div data-library-results aria-live="polite">{% include 'library/bookshelf_results.html' %}</div>
</section>
{% endblock %}
