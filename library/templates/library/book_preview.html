{% extends 'library/base.html' %}

{% block library_content %}
    <div class="library-breadcrumb" role="navigation" aria-label="页面位置">
        <a href="{% url 'library:bookshelf' %}">我的书库</a><span>/</span><span>书籍详情草图</span>
    </div>

    <section class="library-panel library-detail">
        <div class="library-detail-cover cover-blue" aria-hidden="true"><i class="fa fa-book"></i></div>
        <div class="library-detail-info">
            <span class="library-preview-badge">示例书籍 · 未保存</span>
            <h1>示例书籍：Django 入门</h1>
            <p class="library-detail-author">作者示例 · 技术分类示例</p>
            <p class="library-detail-description">这里将展示书籍简介、作者、出版社和出版信息。此页面仅用于确认布局；接入数据后，会由真实书籍详情替换。</p>
            <div class="library-detail-meta">
                <div><span>阅读状态</span><strong>在读（示例）</strong></div>
                <div><span>当前进度</span><strong>35%（示例）</strong></div>
                <div><span>电子书文件</span><strong>暂无</strong></div>
            </div>
            <div class="library-progress" aria-label="示例阅读进度 35%"><span style="width: 35%"></span></div>
            <div class="library-actions">
                <button class="library-button library-button-primary" type="button" disabled title="阅读进度尚未接入">更新进度</button>
                <button class="library-button" type="button" disabled title="笔记功能尚未接入">添加笔记</button>
                <button class="library-button" type="button" disabled title="电子书下载尚未接入">下载电子书</button>
            </div>
        </div>
    </section>

    <section class="library-panel library-notes">
        <div class="library-section-heading"><div><h2>我的笔记</h2><p>之后可在这里整理摘录和读后感。</p></div></div>
        <div class="library-empty library-empty-compact">
            <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
            <h3>暂无笔记</h3>
            <p>笔记功能将在后续接入。</p>
        </div>
    </section>
{% endblock %}
